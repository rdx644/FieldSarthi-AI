services:
  - type: web
    name: fieldsaarthi-ai
    repo: https://github.com/rdx644/FieldSarthi-AI
    branch: main
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeployTrigger: 'off'
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fieldsaarthi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GNANI_API_KEY_ID
        sync: false
      - key: GNANI_TTS_ENABLED
        value: 'true'
      - key: PUBLIC_JUDGE_DEMO_ENABLED
        value: 'true'
      - key: DEMO_WORKER_PASSWORD
        sync: false
      - key: DEMO_WORKER2_PASSWORD
        sync: false
      - key: DEMO_SUPERVISOR_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: ''
databases:
  - name: fieldsaarthi-db
    plan: free
    region: singapore
    databaseName: fieldsaarthi
    user: fieldsaarthi
    postgresMajorVersion: '18'
    ipAllowList: []
