[project]
name = "fieldsaarthi-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "pydantic==2.13.3", "python-dotenv==1.2.1"]

[dependency-groups]
dev = ["pytest==9.0.3", "ruff==0.14.10", "mypy==1.19.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
